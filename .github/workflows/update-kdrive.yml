name: Update kDrive Latest

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Infomaniak abfragen und bei neuer Version hochladen
        run: |
          set -euo pipefail
          JSON=$(curl -sSf https://www.infomaniak.com/drive/latest)
          VER=$(jq -r '."linux-amd64".version' <<<"$JSON")
          URL=$(jq -r '."linux-amd64".downloadurl' <<<"$JSON")

          # Nur Downloads direkt von Infomaniak zulassen
          case "$URL" in
            https://download.storage.infomaniak.com/drive/desktopclient/*.AppImage) ;;
            *) echo "Unerwartete URL: $URL"; exit 1 ;;
          esac

          CUR=$(gh release view latest --json name -q .name 2>/dev/null || echo none)
          if [ "$CUR" = "kDrive $VER" ]; then
            echo "Unverändert: $VER"; exit 0
          fi

          curl -sSfL -o kDrive-latest-amd64.AppImage "$URL"
          sha256sum kDrive-latest-amd64.AppImage

          if [ "$CUR" = none ]; then
            gh release create latest kDrive-latest-amd64.AppImage \
              --title "kDrive $VER" --notes "Quelle: $URL" --latest
          else
            gh release upload latest kDrive-latest-amd64.AppImage --clobber
            gh release edit latest --title "kDrive $VER" --notes "Quelle: $URL"
          fi
